<ion-content class="auth-page__content">
    <div class="auth-card">
      <p class="eyebrow">Connexion</p>
      <h1>Accédez à Snapy</h1>
      <p class="lead">
        Suivez vos interventions et recevez des rapports fiables en quelques secondes.
      </p>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label class="field">
          <span>Email professionnel</span>
          <ion-input
            type="email"
            formControlName="email"
            placeholder="exemple@entreprise.com"
            autocomplete="username"
          ></ion-input>
          <small *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
            Merci de saisir une adresse email valide.
          </small>
        </label>

        <label class="field">
          <span>Mot de passe</span>
          <ion-input
            type="password"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
          ></ion-input>
          <small *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
            Un mot de passe est requis.
          </small>
        </label>

        <ion-button
          class="form-action primary"
          type="submit"
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading">Connexion en cours...</span>
        </ion-button>
      </form>

      <p class="error-message" *ngIf="error()">{{ error() }}</p>

      <footer class="auth-footer">
        <p>Pas encore de compte ?</p>
        <a routerLink="/register-company">Enregistrer une entreprise en quelques minutes.</a>
      </footer>
    </div>
  </ion-content>
